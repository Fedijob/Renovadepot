<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dépôt — Contrôle du matériel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c0e; --glow:rgba(19,142,110,.30);
  --card:#111a1d; --card2:#162126; --line:#1f2d33; --line2:#26363d;
  --text:#e9f1f1; --muted:#8b9aa1; --dim:#64757c;
  --green:#18d18d; --green2:#12b87a; --green-ink:#03221a; --green-dim:rgba(24,209,141,.14);
  --amber:#e0a33c; --amber-dim:rgba(224,163,60,.14);
  --red:#ff6f59; --red-dim:rgba(255,111,89,.13);
  --blue:#6fa8dc; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6f6; --glow:rgba(19,142,110,.12);
  --card:#fff; --card2:#f0f3f3; --line:#e2e7e7; --line2:#d7dedd;
  --text:#101718; --muted:#5f6e73; --dim:#8b989d;
  --green:#0f9d6b; --green2:#0c8259; --green-ink:#fff; --green-dim:rgba(15,157,107,.12);
  --amber:#9a6a13; --amber-dim:rgba(154,106,19,.12);
  --red:#c2402c; --red-dim:rgba(194,64,44,.10); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;
  background-image:radial-gradient(760px 420px at 6% -6%,var(--glow),transparent 62%);background-attachment:fixed}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.025em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--green-dim)}

/* ---------- coque ---------- */
.wrap{max-width:470px;margin:0 auto;padding:0 18px 132px;min-height:100vh}
.hdr{display:flex;align-items:center;gap:12px;padding:20px 0 16px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 62%,transparent)}
.hdr .logo{width:42px;height:42px;border-radius:13px;background:var(--green-dim);border:1px solid var(--line2);
  display:grid;place-items:center;font-weight:800;color:var(--green);font-size:17px;flex:none}
.hdr .nm{flex:1;min-width:0}
.hdr .nm b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .nm span{font-size:12.5px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;font-size:13px;font-weight:600}
.iconbtn:hover{border-color:var(--green);color:var(--green)}
.iconbtn.me{color:var(--text)}

.eyebrow{font-size:13px;color:var(--muted);margin-bottom:2px}
.title{font-size:30px;line-height:1.12;margin-bottom:18px;letter-spacing:-.035em}

/* ---------- cartes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.card.flat{background:var(--card2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px;min-width:0}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1.15;margin:3px 0 2px}
.stat .s{font-size:12px;color:var(--dim)}
.stat .s.warn{color:var(--amber)}
.stat .s.bad{color:var(--red)}
.stat.bad .v{color:var(--red)}
.big{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big .v{font-size:31px;font-weight:700;letter-spacing:-.04em;margin-top:2px}
.pct{color:var(--green);font-size:13px;font-weight:600}
.track{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;background:var(--green);border-radius:99px}
.track.amber i{background:var(--amber)}
.track.red i{background:var(--red)}

/* ---------- boutons ---------- */
.cta{display:block;width:100%;padding:17px 20px;border:0;border-radius:15px;background:var(--green);color:var(--green-ink);
  font-size:15.5px;font-weight:700;cursor:pointer;margin:16px 0 22px;letter-spacing:-.01em}
.cta:hover{background:var(--green2)}
.cta.sec{background:var(--card);color:var(--text);border:1px solid var(--line2)}
.cta.sec:hover{border-color:var(--green);color:var(--green)}
.btn{padding:11px 14px;border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:12px;
  cursor:pointer;font-weight:600;font-size:13.5px;line-height:1.2}
.btn:hover{border-color:var(--line2);background:var(--line)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.go:hover{background:var(--green2)}
.btn.bad{color:var(--red);border-color:var(--line2)}
.btn.bad:hover{background:var(--red-dim);border-color:var(--red)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:600;font-size:13px;cursor:pointer}
.link:hover{text-decoration:underline}

/* ---------- sections ---------- */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 11px}
.sec h2{font-size:17px;letter-spacing:-.025em}

/* ---------- lignes ---------- */
.row{display:flex;gap:12px;align-items:center}
.dot{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.dot.out{background:var(--amber-dim);color:var(--amber)}
.dot.in{background:var(--green-dim);color:var(--green)}
.dot.mute{background:var(--card2);color:var(--muted)}
.dot.big{font-size:15px}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.right{text-align:right;flex:none}
.right .n{font-size:20px;font-weight:700;color:var(--green);letter-spacing:-.03em;line-height:1.1}
.right .n.zero{color:var(--dim)}
.right .u{font-size:11.5px;color:var(--dim)}
.ago{font-size:12px;color:var(--dim);flex:none}

.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag.green{background:var(--green-dim);color:var(--green)}
.tag.amber{background:var(--amber-dim);color:var(--amber)}
.tag.red{background:var(--red-dim);color:var(--red)}
.tag.mute{background:var(--card2);color:var(--muted)}

/* ---------- segmenté ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:9px 6px;border:0;background:none;border-radius:99px;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--green);color:var(--green-ink)}

/* ---------- champs ---------- */
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:13px;
  background:var(--card2);color:var(--text);font-size:15px}
.f input::placeholder{color:var(--dim)}
.f textarea{min-height:64px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.hint{font-size:12.5px;color:var(--dim);margin-top:9px;line-height:1.45}
.search{width:100%;padding:13px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--card);color:var(--text);margin-bottom:14px}

/* ---------- vide ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:5px;font-weight:700;letter-spacing:-.02em}

/* ---------- nav basse ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:0 16px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
.tabs .in{display:flex;gap:2px;background:var(--card);border:1px solid var(--line2);border-radius:22px;
  padding:8px 6px;width:100%;max-width:434px;pointer-events:auto;box-shadow:0 12px 34px rgba(0,0,0,.42)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);cursor:pointer;padding:5px 2px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;position:relative}
.tabs button.on{color:var(--green)}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .bdg{position:absolute;top:-1px;right:50%;transform:translateX(20px);background:var(--red);color:#fff;
  font-size:9.5px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

/* ---------- connexion ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 18px}
.login .in{width:100%;max-width:400px}
.brandlogo{height:34px;width:auto;display:block;flex:none}
.loginlogo{width:230px;max-width:74%;height:auto;display:block;margin-bottom:20px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters select,.filters input{padding:11px 13px;border:1px solid var(--line2);border-radius:12px;background:var(--card2);color:var(--text);font-size:14px}
.filters select{flex:1 1 160px;min-width:0;cursor:pointer}
.daterow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-4px 0 14px}
.daterow .dl{color:var(--muted);font-size:13.5px}
.daterow input[type=date]{padding:11px 13px;border:1px solid var(--line2);border-radius:12px;background:var(--card2);color:var(--text);flex:1 1 150px;min-width:0;font-size:14px}
@media (min-width:1024px){.brandlogo{height:38px}}
.login .mark{width:56px;height:56px;border-radius:17px;background:var(--green-dim);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:23px;font-weight:800;color:var(--green);margin-bottom:20px}
.login h1{font-size:28px;letter-spacing:-.035em;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 26px;font-size:14.5px}
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:17px 18px;margin-bottom:11px;
  border:1px solid var(--line);background:var(--card);border-radius:17px;cursor:pointer;color:inherit}
.pick:hover{border-color:var(--green)}
.pick .ic{width:44px;height:44px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none}
.pick b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.pick span{font-size:12.5px;color:var(--muted);line-height:1.4}

/* ---------- feuille modale ---------- */
.ov{position:fixed;inset:0;background:rgba(3,7,8,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;
  padding:0;overflow-y:auto}
.sheet{background:var(--card);border:1px solid var(--line2);border-radius:24px 24px 0 0;width:100%;max-width:470px;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:8px auto 16px}
.sheet h2{font-size:20px;letter-spacing:-.03em;margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1;padding:14px;border-radius:14px;font-size:14.5px}
@media (min-width:560px){
  .ov{align-items:center;padding:24px}
  .sheet{border-radius:24px;padding-bottom:24px}
}

.railfoot{display:none}
.thumb{width:100%;aspect-ratio:4/3;border-radius:13px 13px 0 0;object-fit:cover;display:block;background:var(--card2)}
.thumb.ph{display:grid;place-items:center;color:var(--dim);font-size:26px}
.pcard{padding:0;overflow:hidden}
.pcard .pin{padding:13px 16px 15px}
.pcard .ttl{font-size:14.5px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.mpick{width:100%;aspect-ratio:4/3;border-radius:13px;object-fit:cover;background:var(--card2);display:block;margin-bottom:8px}
.mpick.ph{display:grid;place-items:center;color:var(--dim);font-size:24px;border:1px dashed var(--line2)}
.photobtn{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px dashed var(--line2);border-radius:12px;background:var(--card2);cursor:pointer;color:var(--muted);font-size:13.5px;width:100%}
.photobtn:hover{border-color:var(--green);color:var(--green)}
@media (min-width:700px){.mgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1024px){.mgrid{grid-template-columns:repeat(4,1fr)}}
/* ---------- tablette & ordinateur ---------- */
.cols{display:block}
.list{display:block}
@media (min-width:700px){
  .wrap{max-width:720px;padding:0 24px 128px}
  .tabs .in{max-width:672px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:12px;align-items:start}
  .list>.card{margin-bottom:0}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats>.stat:only-child{grid-column:span 4}
  .stats>.stat:nth-child(1):nth-last-child(2),.stats>.stat:nth-child(2):nth-last-child(1){grid-column:span 2}
  .cta{max-width:none}
  .feed{max-width:620px}
}
@media (min-width:1024px){
  .tabs{top:0;bottom:0;right:auto;width:244px;padding:0;display:block}
  .tabs .in{flex-direction:column;gap:3px;height:100%;max-width:none;border:0;border-right:1px solid var(--line);
    border-radius:0;box-shadow:none;padding:96px 14px 22px;background:var(--card);overflow-y:auto}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 13px;
    font-size:14px;border-radius:12px}
  .tabs button.on{background:var(--green-dim)}
  .tabs svg{width:19px;height:19px}
  .tabs .bdg{position:static;transform:none;margin-left:auto}
  .railfoot{display:block;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);width:100%}
  .railfoot button{display:flex;flex-direction:row;justify-content:flex-start;gap:12px;width:100%;
    background:none;border:0;color:var(--dim);cursor:pointer;padding:11px 13px;border-radius:12px;font-size:14px;font-weight:600}
  .railfoot button:hover{color:var(--text)}
  .railfoot svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .wrap{margin-left:244px;max-width:1180px;padding:0 40px 60px}
  .hdr{position:fixed;top:0;left:0;width:244px;padding:22px 18px 0;background:none;z-index:31;display:block}
  .hdr .brandlogo{margin-bottom:11px}
  .hdr .nm{margin-bottom:0}
  .hdr .iconbtn{display:none}
  .wrap>.eyebrow{padding-top:30px}
  .cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
  .title{font-size:34px}
  .list{grid-template-columns:repeat(auto-fill,minmax(286px,1fr))}
}
@media (min-width:1024px) and (max-width:1200px){
  .wrap{padding:0 26px 60px}
}
/* clavier/souris : cibles plus fines, survol net */
@media (hover:hover) and (pointer:fine){
  .card[data-a]:hover{border-color:var(--line2)}
  .tabs button:hover{color:var(--text)}
}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:0;right:0;bottom:104px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 18px}
.toast{background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 17px;border-radius:14px;
  font-size:13.5px;font-weight:500;max-width:430px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}

/* ---------- bon ---------- */
.bon{font-size:13px}
.bon .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.bon .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-bottom:16px;font-size:12.5px}
.bon .meta span{color:var(--muted);display:block;font-size:11.5px}
.bon table{width:100%;border-collapse:collapse}
.bon th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:7px 0;border-bottom:1px solid var(--line)}
.bon td{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px;font-size:11.5px;color:var(--muted)}
.sig div{border-top:1px solid var(--line2);padding-top:7px;min-height:52px}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{position:absolute;inset:0;padding:26px;background:#fff;color:#000;font-size:12px}
  #print .sig div{border-top:1px solid #999}
  #print th,#print td{border-bottom:1px solid #ddd}
  #print .meta span{color:#666}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="print"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="imp" accept="application/json" style="display:none">
<input type="file" id="photo-in" accept="image/*" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const EPS=1e-6;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(4,'0');
const today=()=>new Date().toISOString().slice(0,10);
const ymd=d=>d.toISOString().slice(0,10);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmtq=n=>{n=Math.round(n*1000)/1000;return n.toLocaleString('fr-FR',{maximumFractionDigits:3})};
const fmtd=iso=>{if(!iso)return '';const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const money=n=>fmtq(Math.round(n*100)/100)+' '+(DB.settings.currency||'€');
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const days=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));
const initial=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'à l\u2019instant'; if(m<60)return 'il y a '+m+' min';
  const h=Math.floor(m/60); if(h<24)return 'il y a '+h+' h';
  const d=Math.floor(h/24); return d<30?'il y a '+d+' j':'il y a '+Math.floor(d/30)+' mois'}

const TYPE={restock:['Réappro.','in','REA'],issue:['Sortie','out','OUT'],'return':['Retour','in','RET'],
  adjust:['Ajustement','mute','AJU'],writeoff:['Rebut','mute','REB']};
const ICO={
  home:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>',
  box:'<svg viewBox="0 0 24 24"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7z"/><path d="M3.5 7 12 11.4 20.5 7"/><path d="M12 11.4v9.8"/></svg>',

const TABLES=['items','teams','moves','requests','chantiers'];

async function sbInit(){
  try{
    SB=window.supabase.createClient(SB_URL,SB_KEY);
    await sbLoad();
    READY=true;
    sbSubscribe();
    return true;
  }catch(e){SYNCERR=true;return false}
}
async function sbLoad(){
  const out={};
  for(const t of TABLES){
    const {data,error}=await SB.from(t).select('*');
    if(error) throw error;
    out[t]=(data||[]).map(M[t].from);
  }
  const kv=await SB.from('kv').select('*');
  const settings=Object.assign(defaults().settings), seq=Object.assign(defaults().seq);
  if(kv.data){for(const row of kv.data){if(row.k==='settings')Object.assign(settings,row.v||{});if(row.k==='seq')Object.assign(seq,row.v||{})}}
  DB={items:out.items,teams:out.teams,moves:out.moves,requests:out.requests,chantiers:out.chantiers,settings,seq,meta:{}};
  // rebuild shadow
  SHADOW={}; TABLES.forEach(t=>SHADOW[t]={});
  for(const t of TABLES) DB[t].forEach(o=>{SHADOW[t][o.id]=JSON.stringify(M[t].to(o))});
  SHADOW._settings=JSON.stringify(settings); SHADOW._seq=JSON.stringify(seq);
}
function sbSubscribe(){
  const ch=SB.channel('depot');
  TABLES.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>scheduleReload()));
  ch.on('postgres_changes',{event:'*',schema:'public',table:'kv'},()=>scheduleReload());
  ch.subscribe();
}
function scheduleReload(){
  clearTimeout(reloadT);
  reloadT=setTimeout(async()=>{
    if(pushT||Date.now()-lastPush<700){scheduleReload();return} // local write settling
    try{await sbLoad();render()}catch(e){}
  },450);
}
async function pushChanges(){
  pushT=null;
  if(!READY||!SB) return;
  try{
    for(const t of TABLES){
      const cur={}; DB[t].forEach(o=>{cur[o.id]=M[t].to(o)});
      const ups=[];
      for(const id in cur){const j=JSON.stringify(cur[id]); if(SHADOW[t][id]!==j) ups.push(cur[id])}
      const del=[]; for(const id in SHADOW[t]) if(!(id in cur)) del.push(id);
      if(ups.length){const {error}=await SB.from(t).upsert(ups); if(error) throw error}
      if(del.length){const {error}=await SB.from(t).delete().in('id',del); if(error) throw error}
      SHADOW[t]={}; for(const id in cur) SHADOW[t][id]=JSON.stringify(cur[id]);
    }
    const sj=JSON.stringify(DB.settings), qj=JSON.stringify(DB.seq);
    if(SHADOW._settings!==sj){await SB.from('kv').upsert({k:'settings',v:DB.settings});SHADOW._settings=sj}
    if(SHADOW._seq!==qj){await SB.from('kv').upsert({k:'seq',v:DB.seq});SHADOW._seq=qj}
    lastPush=Date.now();
    if(SYNCERR){SYNCERR=false;render()}
  }catch(e){SYNCERR=true;toast('Synchronisation échouée — vérifiez la connexion.','bad');render()}
}
function load(){ try{const s=sessionStorage.getItem('depot.session');if(s)SESSION=JSON.parse(s)}catch(e){} }
function save(){ clearTimeout(pushT); pushT=setTimeout(pushChanges,250); }
function commit(){save();render()}
function setSession(s){SESSION=s;try{sessionStorage.setItem('depot.session',JSON.stringify(s))}catch(e){}render()}
function logout(){SESSION=null;try{sessionStorage.removeItem('depot.session')}catch(e){}state.view='';render()}
const isAdmin=()=>SESSION&&SESSION.role==='admin';

/* ---------- moteur (inchangé) ---------- */
function compute(moves){
  const oh=new Map(),held=new Map();
  for(const m of moves){const it=m.itemId;
    if(m.type==='restock'||m.type==='adjust')oh.set(it,(oh.get(it)||0)+m.qty);
    else if(m.type==='writeoff')oh.set(it,(oh.get(it)||0)-m.qty);
    else if(m.type==='issue'){oh.set(it,(oh.get(it)||0)-m.qty);const k=m.teamId+'|'+it;held.set(k,(held.get(k)||0)+m.qty)}
    else if(m.type==='return'){oh.set(it,(oh.get(it)||0)+m.qty);const k=m.teamId+'|'+it;held.set(k,(held.get(k)||0)-m.qty)}}
  return {onHand:oh,held};
}
function valid(c){for(const v of c.onHand.values())if(v<-EPS)return false;for(const v of c.held.values())if(v<-EPS)return false;return true}
function ctx(){const c=compute(DB.moves);
  const items=new Map(DB.items.map(i=>[i.id,i])),teams=new Map(DB.teams.map(t=>[t.id,t]));
  const heldItem={};for(const[k,v]of c.held){const it=k.split('|')[1];heldItem[it]=(heldItem[it]||0)+v}
  return {items,teams,onHand:id=>c.onHand.get(id)||0,held:c.held,heldItem}}
const onHand=id=>ctx().onHand(id);
const owned=it=>onHand(it.id)+(ctx().heldItem[it.id]||0);
const heldOf=tid=>[...ctx().held.entries()].filter(([k,q])=>k.split('|')[0]===tid&&q>EPS).map(([k,q])=>({itemId:k.split('|')[1],qty:q}));
const heldQty=(tid,iid)=>(heldOf(tid).find(h=>h.itemId===iid)||{}).qty||0;
function dueFor(tid,iid){const s=DB.moves.filter(m=>m.type==='issue'&&m.teamId===tid&&m.itemId===iid&&m.due).sort((a,b)=>a.due<b.due?-1:1);return s.length?s[0].due:null}
function overdue(){const o=[];
  for(const[k,q]of ctx().held){if(q<=EPS)continue;const[t,i]=k.split('|');const d=dueFor(t,i);
    if(d&&d<today())o.push({teamId:t,itemId:i,qty:q,due:d,late:days(d,today())})}
  return o.sort((a,b)=>b.late-a.late)}
function charges(from,to,tf){
  const C=ctx(),out=[],q={};
  const sorted=[...DB.moves].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  for(const m of sorted){
    if(m.type!=='issue'&&m.type!=='return')continue;
    const it=C.items.get(m.itemId);if(!it||!it.returnable||!it.rate)continue;
    if(tf&&m.teamId!==tf)continue;
    const k=m.teamId+'|'+m.itemId;q[k]=q[k]||[];
    if(m.type==='issue')q[k].push({date:m.date,qty:m.qty});
    else{let rem=m.qty;while(rem>EPS&&q[k].length){const h=q[k][0],take=Math.min(h.qty,rem);
      const d=Math.max(0,days(h.date,m.date)-(DB.settings.grace||0));
      if(d>0)out.push({date:m.date,teamId:m.teamId,itemId:m.itemId,amount:take*d*it.rate,detail:fmtq(take)+' × '+d+' j × '+fmtq(it.rate)});
      h.qty-=take;rem-=take;if(h.qty<=EPS)q[k].shift()}}}
  const cut=to&&to<today()?to:today();
  for(const k in q){const[tid,iid]=k.split('|');if(tf&&tid!==tf)continue;
    const it=C.items.get(iid);if(!it)continue;
    for(const l of q[k]){const d=Math.max(0,days(l.date,cut)-(DB.settings.grace||0));
      if(d>0)out.push({date:cut,teamId:tid,itemId:iid,amount:l.qty*d*it.rate,detail:fmtq(l.qty)+' × '+d+' j × '+fmtq(it.rate),open:true})}}
  return out.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));
}

function compressImg(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const max=640;let w=img.width,h=img.height;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(c.toDataURL('image/jpeg',0.72))}catch(e){cb('')}
  };img.onerror=()=>cb('');img.src=rd.result};
  rd.onerror=()=>cb('');rd.readAsDataURL(file);
}

function rangeFromPreset(k){
  const t=today(), n=new Date();
  const back=d=>{const x=new Date();x.setDate(x.getDate()-d);return ymd(x)};
  if(k==='today')return [t,t];
  if(k==='7')return [back(6),t];
  if(k==='30')return [back(29),t];
  if(k==='month')return [t.slice(0,7)+'-01',t];
  if(k==='last')return [ymd(new Date(n.getFullYear(),n.getMonth()-1,1)),ymd(new Date(n.getFullYear(),n.getMonth(),0))];
  return ['',''];
}

function chantierList(){return DB.chantiers.filter(c=>!c.archived).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function chantierNames(){
  // union of managed chantiers + historical site strings, so old sorties stay pickable
  const set=new Set();
  chantierList().forEach(c=>set.add(c.name));
  DB.moves.forEach(m=>{if(m.site)set.add(m.site)});
  DB.teams.forEach(t=>{if(t.site)set.add(t.site)});
  return [...set].sort((a,b)=>a.localeCompare(b,'fr'));
}
function chantierExists(name){name=(name||'').trim().toLowerCase();return DB.chantiers.some(c=>!c.archived&&c.name.toLowerCase()===name)}

function chantierSelectOptions(sel){
  const names=chantierNames();

  const sel=itemId&&pool.some(i=>i.id===itemId)?itemId:pool[0].id;
  const teamsList=kind==='return'&&admin
    ? DB.teams.filter(t=>!t.archived&&heldQty(t.id,sel)>EPS)

    '<div class="f"><label>Article</label><select id="m-item">'+pool.map(i=>'<option value="'+i.id+'"'+(i.id===sel?' selected':'')+'>'+esc(i.name)+'</option>').join('')+'</select></div>'+
    (admin?'<div class="f"><label>Équipe</label><select id="m-team">'+(teamsList.length?teamsList.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join(''):'<option value="">—</option>')+'</select></div>':'')+

      :'<div class="f"><label>État</label><select id="m-cond"><option value="good">Bon état</option><option value="damaged">Endommagé</option></select></div>')+'</div>'+
    (admin?'':'<div class="f"><label>Votre nom</label><input id="m-by" value="'+esc(lastBy())+'" placeholder="qui fait la demande"></div>')+
    (kind==='issue'?'<div class="f"><label>Chantier <span style="color:var(--red);font-weight:400">· obligatoire</span></label><select id="m-site">'+chantierSelectOptions(defaultSite(teamId))+'</select><input id="m-site-new" placeholder="Nom du nouveau chantier" autocomplete="off" style="display:none;margin-top:8px"></div>':'')+

    '<div id="m-max" class="hint"></div>'+
    '<div class="acts"><button class="btn" data-a="close">Annuler</button>'+
    '<button class="btn go" data-a="mv-save" data-id="'+kind+'">'+(admin?'Enregistrer':'Envoyer')+'</button></div>');
  const upd=()=>{
    const iid=val('m-item'), tid=admin?val('m-team'):teamId;
    const max=kind==='issue'?onHand(iid):(admin?heldQty(tid,iid):heldQty(teamId,iid));
    const it=C.items.get(iid);
    $('#m-max').textContent=(kind==='issue'?'Disponible au dépôt : ':'Détenu par l\u2019équipe : ')+fmtq(max)+' '+((it&&it.unit)||'');

    if(kind==='return'&&admin){
      const iid=val('m-item');

  upd();

const ENC=new TextEncoder();
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const dt=new Date();
  const tm=((dt.getHours()<<11)|(dt.getMinutes()<<5)|Math.floor(dt.getSeconds()/2))&0xFFFF;
  const dd=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xFFFF;
  const parts=[],cent=[];let off=0;
  for(const f of files){
    const nm=ENC.encode(f.name),c=crc32(f.data),n=f.data.length;
    const loc=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(tm),...u16(dd),
      ...u32(c),...u32(n),...u32(n),...u16(nm.length),...u16(0)]);
    parts.push(loc,nm,f.data);
    cent.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(tm),...u16(dd),
      ...u32(c),...u32(n),...u32(n),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...nm]));
    off+=loc.length+nm.length+n;
  }
  let cdLen=0;cent.forEach(c=>cdLen+=c.length);
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(cent.length),...u16(cent.length),
    ...u32(cdLen),...u32(off),...u16(0)]);
  let tot=0;parts.forEach(p=>tot+=p.length);tot+=cdLen+eocd.length;
  const out=new Uint8Array(tot);let p=0;
  parts.forEach(x=>{out.set(x,p);p+=x.length});
  cent.forEach(x=>{out.set(x,p);p+=x.length});
  out.set(eocd,p);
  return out;
}

const colN=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-1-m)/26}return s};

function xlsxBuild(sheets){

    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');

    '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+R+'"><sheets>'+
    names.map((n,i)=>'<sheet name="'+xe(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+
    '</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+

      let st=0,sq=0;
      bySite[site].forEach(m=>{const i=C.items.get(m.itemId)||{},v=m.qty*(m.unitCost||0);st+=v;sq+=m.qty;tO+=v;qO+=m.qty;
        rows.push([XT(fmtd(m.date)),XT(m.slip||''),XT(i.name||'—'),XT(i.cat||''),XN(m.qty,4),XT(i.unit||''),
          XN(m.unitCost||0,3),XN(v,3),XT(m.due?fmtd(m.due):'')])});
      rows.push([XT('Sous-total — '+site,6),null,null,null,XN(sq,4),null,null,XN(st,5)]);
      rows.push([]);
    });
    rows.push([XT('TOTAL PRIS DANS LE MOIS',6),null,null,null,XN(qO,4),null,null,XN(tO,5)]);
  }
  rows.push([]);

  const rets=DB.moves.filter(m=>m.teamId===teamId&&m.type==='return'&&m.date>=from&&m.date<=to)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  rows.push([XT('MATÉRIEL RENDU DANS LE MOIS',6)]);
  rows.push(['Date','Bon','Article','Catégorie','Quantité','Unité','Valeur unitaire','Valeur totale','État'].map(h=>XT(h,2)));
  let tR=0,qR=0;
  rets.forEach(m=>{const i=C.items.get(m.itemId)||{},v=m.qty*(m.unitCost||0);tR+=v;qR+=m.qty;
    rows.push([XT(fmtd(m.date)),XT(m.slip||''),XT(i.name||'—'),XT(i.cat||''),XN(m.qty,4),XT(i.unit||''),
      XN(m.unitCost||0,3),XN(v,3),XT(/endommag/i.test(m.note||'')?'Endommagé':'Bon état')])});
  if(!rets.length)rows.push([XT('Aucun retour sur la période')]);
  else rows.push([XT('Total',6),null,null,null,XN(qR,4),null,null,XN(tR,5)]);
  rows.push([]);

  const still=heldAsOf(teamId,to);
  rows.push([XT('ENCORE EN POSSESSION AU '+fmtd(to),6)]);
  rows.push(['Article','Catégorie','Quantité','Unité','Valeur unitaire','Valeur engagée','Retour prévu','Retard (jours)'].map(h=>XT(h,2)));
  let tS=0;
  still.forEach(l=>{const i=C.items.get(l.itemId)||{},v=l.qty*(i.cost||0);tS+=v;
    const d=dueFor(teamId,l.itemId),late=d&&d<to?days(d,to):0;
    rows.push([XT(i.name||'—'),XT(i.cat||''),XN(l.qty,4),XT(i.unit||''),XN(i.cost||0,3),XN(v,3),
      XT(d?fmtd(d):'—'),late?XN(late,4):XT('')])});
  if(!still.length)rows.push([XT('Tout est rentré au dépôt')]);
  else rows.push([XT('Total',6),null,null,null,null,XN(tS,5)]);

  const fr=charges(from,to,teamId);
  if(fr.length){
    rows.push([]);
    rows.push([XT('FRAIS DE LOCATION DU MOIS',6)]);
    rows.push(['Date','Article','Calcul','Montant'].map(h=>XT(h,2)));
    let tF=0;
    fr.sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{const i=C.items.get(r.itemId)||{};tF+=r.amount;
      rows.push([XT(fmtd(r.date)+(r.open?' (en cours)':'')),XT(i.name||'—'),XT(r.detail),XN(r.amount,3)])});
    rows.push([XT('Total',6),null,null,XN(tF,5)]);
  }
  return rows;
}
/* ---- feuille de synthèse ---- */
function synthRows(teams,from,to,plabel){
  const C=ctx(),rows=[];
  rows.push([XT(DB.settings.company||'Dépôt',1)]);
  rows.push([XT('Synthèse — '+plabel,6)]);
  rows.push([XT('Période',6),XT(fmtd(from)+(from!==to?' au '+fmtd(to):''))]);
  rows.push([]);
  const allOuts=DB.moves.filter(m=>m.type==='issue'&&m.date>=from&&m.date<=to);
  const tQty=allOuts.reduce((s,m)=>s+m.qty,0);
  const tVal=allOuts.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
  rows.push([XT('TOTAUX DU DÉPÔT SUR LA PÉRIODE',6)]);
  rows.push([XT('Quantité totale prise',6),XN(tQty,5)]);
  rows.push([XT('Valeur totale prise',6),XN(tVal,5)]);
  rows.push([]);
  rows.push(['Équipe','Chef d\u2019équipe','Chantier','Qté prise','Sorties (lignes)','Valeur prise',
    'Retours (lignes)','Valeur rendue','Encore détenu','Frais de location'].map(h=>XT(h,2)));
  let qy=0,a=0,b=0,c=0,f=0;
  teams.forEach(t=>{
    const outs=DB.moves.filter(m=>m.teamId===t.id&&m.type==='issue'&&m.date>=from&&m.date<=to);
    const rets=DB.moves.filter(m=>m.teamId===t.id&&m.type==='return'&&m.date>=from&&m.date<=to);
    const qo=outs.reduce((s,m)=>s+m.qty,0);
    const vo=outs.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
    const vr=rets.reduce((s,m)=>s+m.qty*(m.unitCost||0),0);
    const vs=heldAsOf(t.id,to).reduce((s,l)=>s+l.qty*((C.items.get(l.itemId)||{}).cost||0),0);
    const vf=charges(from,to,t.id).reduce((s,r)=>s+r.amount,0);
    qy+=qo;a+=vo;b+=vr;c+=vs;f+=vf;
    rows.push([XT(t.name),XT(t.leader||''),XT(t.site||''),XN(qo,4),XN(outs.length,4),XN(vo,3),
      XN(rets.length,4),XN(vr,3),XN(vs,3),XN(vf,3)]);
  });
  rows.push([XT('Total',6),null,null,XN(qy,5),null,XN(a,5),null,XN(b,5),XN(c,5),XN(f,5)]);
  return rows;
}

function applyMove(kind,teamId,lines,due,note,site,mdate){
  const slip=(kind==='issue'?'BS-':'BR-')+pad(kind==='issue'?++DB.seq.bs:++DB.seq.br);
  const test=[...DB.moves];
  for(const l of lines){const it=ctx().items.get(l.itemId);if(!it)continue;
    test.push({id:uid(),slip,date:mdate||today(),ts:Date.now(),type:kind,itemId:l.itemId,teamId,qty:num(l.qty),
      unitCost:it.cost,rate:kind==='issue'?it.rate:0,due:kind==='issue'?(due||null):null,site:kind==='issue'?(site||''):'',
      note:kind==='return'&&l.cond==='damaged'?'Rendu endommagé':(note||'')})}
  if(!valid(compute(test))){if(kind==='issue')--DB.seq.bs;else --DB.seq.br;return null}
  DB.moves=test;return slip;
}

  'item-save':(el,id)=>{
    const name=val('f-name').trim();if(!name)return toast('Indiquez un nom.','bad');
    const d={name,cat:val('f-cat').trim(),unit:val('f-unit').trim()||'pcs',cost:num(val('f-cost')),
      rate:num(val('f-rate')),min:num(val('f-min')),loc:val('f-loc').trim()};
    if(id){const it=ctx().items.get(id);Object.assign(it,d);it.photo=DRAFT_PHOTO||'';if(!it.returnable)it.rate=0}
    else{d.returnable=val('f-ret')==='1';if(!d.returnable)d.rate=0;
      const it=Object.assign({id:uid(),archived:false,notes:''},d);it.photo=DRAFT_PHOTO||'';DB.items.push(it);
      const q=num(val('f-qty'));
      if(q>0)DB.moves.push({id:uid(),slip:'REA-'+pad(++DB.seq.rea),date:today(),ts:Date.now(),type:'restock',
        itemId:it.id,teamId:null,qty:q,unitCost:it.cost,rate:0,due:null,note:'Stock initial'})}
    close();commit();toast('Article enregistré.','ok')},
  'item-del':(el,id)=>confirmBox('Supprimer cet article ? Son historique reste dans le journal.',
    ()=>{DB.items=DB.items.filter(x=>x.id!==id);close();commit();toast('Article supprimé.')},{danger:true,yes:'Supprimer'}),
  adjust:(el,id)=>adjustSheet(id),
  'adjust-save':()=>{
    const it=ctx().items.get(val('a-item')),type=val('a-type'),q=num(val('a-qty'));
    if(!it)return toast('Choisissez un article.','bad');
    if(!q||(type==='restock'&&q<0))return toast('Indiquez une quantité valide.','bad');
    const delta=type==='adjust'?q:type==='writeoff'?-Math.abs(q):q;
    if(type!=='restock'&&onHand(it.id)+delta<-EPS)return toast('Le stock passerait sous zéro ('+fmtq(onHand(it.id))+' en dépôt).','bad');
    const nc=val('a-cost').trim();if(nc!==''&&num(nc)>=0)it.cost=num(nc);
    DB.moves.push({id:uid(),slip:(type==='restock'?'REA-':'AJU-')+pad(++DB.seq.rea),date:val('a-date')||today(),
      ts:Date.now(),type,itemId:it.id,teamId:null,qty:type==='writeoff'?Math.abs(q):q,unitCost:it.cost||0,rate:0,due:null,note:val('a-note').trim()});
    close();commit();toast('Stock mis à jour.','ok')},
  // équipes
  'team-new':()=>teamSheet(null),'team-edit':(el,id)=>teamSheet(id),'team-open':(el,id)=>teamDetail(id),
  'team-quick':()=>{
    const name=val('nt-name').trim();if(!name)return toast('Indiquez un nom d\u2019équipe.','bad');
    const pin=val('nt-pin').trim();if(!/^\d{4,8}$/.test(pin))return toast('Le code doit contenir 4 à 8 chiffres.','bad');
    DB.teams.push({id:uid(),archived:false,name,leader:val('nt-leader').trim(),phone:'',site:'',pin,notes:''});
    commit();toast('Équipe créée — code '+pin+'.','ok')},
  'ch-quick':()=>{
    const name=val('ch-name').trim();if(!name)return toast('Indiquez un nom de chantier.','bad');
    if(chantierExists(name))return toast('Ce chantier existe déjà.','bad');
    DB.chantiers.push({id:uid(),name,addr:val('ch-addr').trim(),archived:false});
    commit();toast('Chantier « '+name+' » créé.','ok')},
  'ch-edit':(el,id)=>chantierSheet(id),
  'ch-save':(el,id)=>{const c=DB.chantiers.find(x=>x.id===id);if(!c)return;
    const name=val('ch-name2').trim();if(!name)return toast('Indiquez un nom.','bad');
    c.name=name;c.addr=val('ch-addr2').trim();close();commit();toast('Chantier enregistré.','ok')},
  'ch-arch':(el,id)=>{const c=DB.chantiers.find(x=>x.id===id);if(!c)return;
    c.archived=true;commit();toast('Chantier archivé.')},
  'ch-del':(el,id)=>confirmBox('Supprimer ce chantier ? Les sorties déjà enregistrées le conservent dans leur historique.',
    ()=>{DB.chantiers=DB.chantiers.filter(x=>x.id!==id);close();commit();toast('Chantier supprimé.')},{danger:true,yes:'Supprimer'}),
  'team-save':(el,id)=>{
    const name=val('t-name').trim();if(!name)return toast('Indiquez un nom.','bad');
    const pin=val('t-pin').trim();if(!/^\d{4,8}$/.test(pin))return toast('Le code doit contenir 4 à 8 chiffres.','bad');
    const d={name,leader:val('t-leader').trim(),phone:val('t-phone').trim(),site:val('t-site').trim(),pin};
    if(id)Object.assign(ctx().teams.get(id),d);else DB.teams.push(Object.assign({id:uid(),archived:false,notes:''},d));
    close();commit();toast('Équipe enregistrée.','ok')},
  'team-del':(el,id)=>confirmBox('Supprimer cette équipe ? Son historique reste dans le journal.',
    ()=>{DB.teams=DB.teams.filter(x=>x.id!==id);close();commit();toast('Équipe supprimée.')},{danger:true,yes:'Supprimer'}),
  'team-newcode':(el,id)=>{const t=ctx().teams.get(id);if(!t)return;
    confirmBox('Générer un nouveau code d\u2019accès pour « '+t.name+' » ? L\u2019ancien code ne fonctionnera plus.',()=>{
      const code=String(1000+Math.floor(Math.random()*9000));t.pin=code;commit();
      sheet('<h2>Nouveau code</h2><p class="lead">Communiquez ce code au chef d\u2019équipe. L\u2019ancien ne marche plus.</p>'+
        '<div class="stat" style="text-align:center"><div class="l">'+esc(t.name)+'</div><div class="v num" style="font-size:38px;letter-spacing:6px">'+code+'</div></div>'+
        '<div class="acts"><button class="btn go" data-a="close">Compris</button></div>');
    },{yes:'Générer',title:'Réinitialiser le code'})},
  bon:(el,slip)=>bon(slip),
  'bon-pdf':(el,slip)=>bonPDF(slip),
  'xls-open':(el,id)=>{XP.team=id||'';exportSheet(id||'')},
  'xls-team':(el,id)=>{XP.team=id||'';XP.mode='month';exportSheet(id||'')},
  'xp-month':()=>{XP.team=val('x-team');XP.day=val('x-day')||XP.day;XP.mode='month';exportSheet()},
  'xp-day':()=>{XP.team=val('x-team');XP.month=val('x-month')||XP.month;XP.mode='day';exportSheet()},
  'xp-xlsx':()=>{const g=readExportPeriod();close();doExport(g.from,g.to,g.tid,g.plabel,g.fname)},
  'xp-pdf':()=>{const g=readExportPeriod();close();doExportPDF(g.from,g.to,g.tid,g.plabel,g.fname)},
  more:()=>{state.limit+=20;render()},
  // données
  'csv-inv':()=>{const C=ctx();
    const out=[['Article','Catégorie','Type','Unité','Emplacement','En dépôt','Sorti','Total','Valeur unitaire','Valeur totale','Tarif/jour','Seuil']]
    .concat(DB.items.map(i=>[i.name,i.cat,i.returnable?'Prêtable':'Consommable',i.unit,i.loc,onHand(i.id),C.heldItem[i.id]||0,owned(i),
      String(i.cost).replace('.',','),(owned(i)*i.cost).toFixed(2).replace('.',','),String(i.rate||0).replace('.',','),i.min||0]));
    saveFile('inventaire-'+today()+'.csv',toCSV(out));toast('Inventaire exporté.','ok')},
  'csv-ledger':()=>{const C=ctx();
    const rows=[...DB.moves].sort((a,b)=>a.ts-b.ts);
    const out=[['Date','Bon','Type','Article','Équipe','Quantité','Valeur unitaire','Valeur','Retour prévu','Note']]
    .concat(rows.map(m=>{const i=C.items.get(m.itemId),t=C.teams.get(m.teamId);
      return [fmtd(m.date),m.slip,TYPE[m.type][0],i?i.name:'',t?t.name:'',m.qty,String(m.unitCost).replace('.',','),
        (m.qty*m.unitCost).toFixed(2).replace('.',','),fmtd(m.due)||'',m.note||'']}));
    saveFile('journal-'+today()+'.csv',toCSV(out));toast('Journal exporté.','ok')},
  'csv-backup':()=>{saveFile('sauvegarde-depot-'+today()+'.json',
    JSON.stringify({items:DB.items,teams:DB.teams,moves:DB.moves,requests:DB.requests,chantiers:DB.chantiers,settings:DB.settings,seq:DB.seq},null,2),'application/json');
    toast('Sauvegarde téléchargée.','ok')},
  restore:()=>$('#imp').click(),
  'set-save':()=>{const s=DB.settings;
    s.company=val('st-company').trim()||'Dépôt';s.currency=val('st-cur').trim()||'€';
    s.grace=Math.max(0,Math.round(num(val('st-grace'))));s.sep=val('st-sep');
    const p=val('st-pin').trim();if(!/^\d{4,8}$/.test(p))return toast('Le code doit contenir 4 à 8 chiffres.','bad');
    s.adminPin=p;s.requireApproval=val('st-appr')==='1';close();commit();toast('Paramètres enregistrés.','ok')},
  sample:()=>{if(DB.items.length||DB.teams.length)return;loadSample();state.view='home';save();render();toast('Exemple chargé.','ok')},
  erase:()=>confirmBox('Supprime définitivement articles, équipes, mouvements et demandes.',
    ()=>{const s=DB.settings;DB=defaults();DB.settings=s;state.view='home';close();commit();toast('Données effacées.')},
    {danger:true,word:'SUPPRIMER',yes:'Tout effacer',title:'Effacer toutes les données'})
};

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');
  if(v){state.view=v.dataset.v;state.q='';state.limit=20;state.jteam='';state.jrange='all';state.jfrom='';state.jto='';close();render();return}
  const s=e.target.closest('[data-s]');
  if(s){state.seg=s.dataset.s;render();return}
  const a=e.target.closest('[data-a]');
  if(!a){if(e.target.classList&&e.target.classList.contains('ov'))close();return}
  const f=A[a.dataset.a];if(f)f(a,a.dataset.id);
});
document.addEventListener('input',e=>{
  if(e.target.hasAttribute&&e.target.hasAttribute('data-q')){
    state.q=e.target.value;
    const p=e.target.selectionStart;render();
    const n=document.querySelector('[data-q]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='f-ret'){const w=$('#rw');if(w)w.style.display=el.value==='1'?'':'none';return}
  if(el.hasAttribute&&el.hasAttribute('data-jf')){state[el.dataset.jf]=el.value;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').firstChild)close();
  if(e.key==='Enter'){const id=document.activeElement&&document.activeElement.id;
    if(id==='pin')A['li-admin-go']();else if(id==='ltp')A['li-team-go']()}
});
function dataURLtoBlob(u){const a=u.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]);let n=b.length;const arr=new Uint8Array(n);while(n--)arr[n]=b.charCodeAt(n);return new Blob([arr],{type:m})}
async function uploadPhoto(dataUrl){
  if(!SB) return dataUrl; // fallback: keep inline
  try{
    const blob=dataURLtoBlob(dataUrl);
    const name='item-'+uid()+'.jpg';
    const {error}=await SB.storage.from('photos').upload(name,blob,{contentType:'image/jpeg',upsert:true});
    if(error) throw error;
    const {data}=SB.storage.from('photos').getPublicUrl(name);
    return data.publicUrl;
  }catch(e){toast('Envoi de la photo échoué.','bad');return dataUrl}
}
$('#photo-in').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>12*1024*1024)return toast('Image trop lourde (max 12 Mo).','bad');
  compressImg(f,async data=>{if(!data)return toast('Impossible de lire cette image.','bad');
    DRAFT_PHOTO=data; if(PHOTO_CB)PHOTO_CB(data); else redrawPhoto();
    toast('Envoi de la photo…');
    const url=await uploadPhoto(data);
    DRAFT_PHOTO=url; redrawPhoto();
  });
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d.items)||!Array.isArray(d.teams)||!Array.isArray(d.moves))throw 0;
    confirmBox('Remplacer toutes les données ? La sauvegarde contient '+d.items.length+' articles, '+d.teams.length+' équipes et '+d.moves.length+' mouvements.',
      ()=>{DB=Object.assign(defaults(),{items:d.items,teams:d.teams,moves:d.moves,requests:d.requests||[],chantiers:d.chantiers||[],
        settings:Object.assign(defaults().settings,d.settings||{}),seq:Object.assign(defaults().seq,d.seq||{})});
        commit();toast('Sauvegarde restaurée.','ok')},{yes:'Remplacer',title:'Restaurer',danger:true})
  }catch(x){toast('Fichier invalide.','bad')}};
  r.readAsText(f);
});
(function(){const t=localStorage.getItem('depot.theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
load();
function bootScreen(msg,retry){
  $('#root').innerHTML='<div class="login"><div class="in" style="text-align:center">'+
    '<div class="mark" style="margin:0 auto 20px">'+(retry?'⚠':'⏳')+'</div>'+
    '<h1>'+(retry?'Connexion impossible':'Connexion au dépôt…')+'</h1>'+
    '<p>'+esc(msg)+'</p>'+
    (retry?'<button class="cta" data-a="reboot">Réessayer</button>':'')+
  '</div></div>';
}
async function boot(){
  bootScreen('Chargement des données…');
  if(!window.supabase){bootScreen('Bibliothèque de connexion non chargée. Vérifiez votre connexion internet.',true);return}
  const ok=await sbInit();
  if(!ok){bootScreen('Impossible de joindre la base de données. Vérifiez la connexion, puis réessayez.',true);return}
  render();
}
document.addEventListener('click',e=>{const r=e.target.closest('[data-a="reboot"]');if(r)boot()});
boot();
})();
</script>
